[package]
name = "microvm-compat"
version = "0.1.0"
edition = "2024"

[dependencies]
kvm-bindings = { version = "0.14", features = ["fam-wrappers"] }
kvm-ioctls = "0.24"
vm-memory = { version = "0.17", features = ["backend-mmap"] }
nix = { version = "0.30", features = ["fs", "net", "feature"] }
libc = "0.2"
