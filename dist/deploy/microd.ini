# Production config for microd (system service deployment).
#
# Path: /etc/microd/config.ini
# Read by: microd at startup (via --config flag in the systemd unit,
#          or auto-discovered at /etc/microd/config.ini).
# Override precedence: defaults → this file → CLI flags.

[daemon]
# Unix socket for microctl ↔ microd IPC.
# Directory must exist and be writable by the microd user.
socket = /run/microd/microd.sock

# Per-VM serial console output goes here as <log_dir>/<name_hash>/serial.log.
# Directory must exist and be writable by the microd user.
log_dir = /var/log/microd

[s3]
# S3 endpoint. Replace with the production RustFS/MinIO URL.
endpoint = http://192.168.88.15:9090

# S3 admin credentials — used ONLY by the orchestrator for bucket
# create/HEAD operations (per-VM bucket lifecycle). Per-VM S3 access
# inherits these defaults too (known gap — see research/15 §11).
#
# For production: replace with real credentials. Prefer reading from
# a sops-encrypted file + EnvironmentFile= in the systemd unit rather
# than inlining here, so /etc/microd/config.ini can be world-readable
# for ops convenience without leaking creds.
admin_access_key = CHANGEME
admin_secret_key = CHANGEME

[defaults]
# Guest kernel + initrd. Installed to /var/lib/microd/ by deployment.
kernel = /var/lib/microd/vmlinux
initrd = /var/lib/microd/initramfs.cpio.gz

# Golden-FS bucket. Loaded ONCE at daemon startup; all VMs share the
# in-memory caches. Pre-upload the golden manifest + blobs to this
# bucket via dist/golden-upload before starting the daemon.
# Remove this line (or leave blank) to disable the golden layer.
golden_bucket = golden

# Default ruleset for VMs that don't specify one. Ships with the
# binary drop under /etc/microd/. See coding-agent.toml in the
# repo at s3-rootfs/rulesets/ for the canonical dev version.
ruleset = /etc/microd/coding-agent.toml

# Root for per-VM ephemeral storage: <ephemeral_root>/<name_hash>/<path>.
# Must be a real filesystem (NOT tmpfs — tmpfs is still RAM and
# defeats the disk-backed ephemeral design). Recommend /var/lib
# with plenty of free space; individual VM ephemeral dirs are
# cleaned up on VM stop.
ephemeral_root = /var/lib/microd/ephemeral
