[package]
name = "s3-rootfs"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR BSD-3-Clause"
description = "S3-backed FUSE filesystem for VM root filesystems"

[dependencies]
fuse-backend-rs = { version = "0.14", features = ["virtiofs"] }
rusty-s3 = "0.9"
ureq = "3"
libc = "0.2"
percent-encoding = "2.3.2"
bincode = "1"
serde = { version = "1", features = ["derive"] }
rayon = "1"
lru = "0.12"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
blake3 = "1"

[[bench]]
name = "fuse_ops"
harness = false
