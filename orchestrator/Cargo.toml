[package]
name = "orchestrator"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "microd"
path = "src/main.rs"

[lib]
name = "orchestrator"
path = "src/lib.rs"

[dependencies]
microvm = { path = "../microvm" }
s3-rootfs = { path = "../s3-rootfs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
libc = "0.2"
ureq = "3"
rusty-s3 = "0.9"
