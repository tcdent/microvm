[package]
name = "microvm"
version = "0.1.0"
edition = "2024"

[lib]
name = "microvm"
path = "src/lib.rs"

[[bin]]
name = "microvm"
path = "src/main.rs"

[dependencies]
kvm-bindings = { version = "0.14", features = ["fam-wrappers"] }
kvm-ioctls = "0.24"
vm-memory = { version = "0.17", features = ["backend-mmap"] }
linux-loader = { version = "0.13", features = ["bzimage", "elf"] }
nix = { version = "0.30", features = ["fs", "mman", "ioctl", "net", "poll"] }
vm-superio = "0.8"
libc = "0.2"
fuse-backend-rs = { version = "0.14", features = ["virtiofs"] }
virtio-queue = "0.17"
xdp-net = { path = "../../rust-vmm/xdp-net" }
s3-rootfs = { path = "../s3-rootfs" }
virtio-fs-transport = { path = "../virtio-fs-transport" }
sharedfs = { path = "../sharedfs" }
vmm-sys-util = "0.15.0"
